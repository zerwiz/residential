# Netlify configuration for Next.js application

[build]
  command = "npm run build"
  publish = ".next"

# Netlify functions directory (for API routes if needed)
functionsDirectory = ".netlify/functions"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for production deployments
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js image optimization headers
[[headers]]
  for = "/_next/image-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js build environment settings
[build.environment]
  # Tailwind v4 uses `lightningcss` (native). Do not omit optional deps.
  NPM_FLAGS = ""
