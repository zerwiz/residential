# Netlify configuration for Next.js application

# Build settings
[build]
  command = "npm run build"
  # Publish the .next directory (Next.js output)
  publish = ".next"

# Remove functionsDirectory - not needed for standard Next.js
# functionsDirectory = ".netlify/functions"

# SPA fallback - all requests redirect to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js image optimization headers
[[headers]]
  for = "/_next/image-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure .next is included in .npmignore
[build.environment]
  NPM_FLAGS = "--no-optional"
